<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" role="img" aria-label="Gokulnath S - Python and AI Backend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <style>
      .title { font: 700 52px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; animation: fadeUp 1.1s ease-out both; }
      .sub   { font: 400 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #99f6e4; animation: fadeUp 1.1s ease-out .4s both; }
      .line  { stroke: #2dd4bf; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 160; stroke-dashoffset: 160; animation: draw 1.2s ease-out .8s forwards; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>
  <rect width="900" height="180" rx="14" fill="url(#bg)"/>
  <text class="title" x="450" y="82" text-anchor="middle">Gokulnath S</text>
  <line class="line" x1="370" y1="102" x2="530" y2="102"/>
  <text class="sub" x="450" y="138" text-anchor="middle">Python &amp; AI Backend Developer  |  B.E. CSE</text>
</svg>
